name: CI

# The release workflow only fires on tags, so without this the test suite runs
# just on the author's machine. Windows because that is the platform the code
# targets: the sidecar's polled-stdin warmup, the extXYZ/DeepMD path handling
# and the NSIS bundle are all Windows-specific.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # First because it inspects the source tree only: a version mismatch is
      # known in seconds instead of after the toolchain install.
      - name: Check version fields agree
        shell: pwsh
        run: |
          try {
            .\scripts\sync_version.ps1 -Check
          } catch {
            # Job logs need a signed-in session; the step summary does not.
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "sync_version -Check failed: $($_.Exception.Message)"
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-test.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r tests/requirements-test.txt

      # The shipped app loads the native geometry kernel; without it
      # tests/test_native_stats.py skips and CI never covers the accelerated path.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native geometry kernel
        shell: pwsh
        # -Require: this job exists to cover the accelerated path, so a missing
        # compiler must fail here rather than skip every native test silently.
        run: .\scripts\build_native.ps1 -Require

      - name: Run backend tests
        run: python -m pytest tests -q

      # The numbers themselves are not gated - runner timing varies by an order
      # of magnitude - but a benchmark that no longer runs is worse than one
      # that regressed, so the cheapest suite is exercised here.
      - name: Smoke the benchmark harness
        run: python benchmark/run_benchmarks.py --quick --suite analysis

  # The bridge's frame re-alignment and bundle-verification invariants live in
  # #[cfg(test)] code in src-tauri/src/main.rs, and nothing executed them: this
  # job is their only home. Separate so a cold crate build cannot spend the
  # backend job's timeout.
  bridge:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # tauri.conf.json maps bundle.resources -> src-tauri/resources/backend,
      # which scripts/prepare_sidecar.ps1 generates and .gitignore excludes.
      # tauri-build refuses to compile the crate while that path does not exist
      # (tauri-utils ResourcePaths checks `path.exists()`), so the bridge's unit
      # tests cannot build from a bare checkout. An empty directory is all the
      # validator asks for; the real bundle is the release workflow's job, and
      # nothing here pretends to be one.
      - name: Provide the bundle resource path
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path src-tauri/resources/backend | Out-Null

      - name: Cache the cargo target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      # e2e starts the dev server itself (playwright.config.ts webServer). It is
      # the only layer that drives the real renderer, so it must run here even
      # though it currently talks to preview.tsx's mock backend: the specs pin
      # interaction behaviour that no unit test reaches.
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test
