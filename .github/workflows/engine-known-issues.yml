name: Engine known issues

# Not a pull-request gate: the checks exercise the *installed upstream engine*
# (they build DPA4 over 216-atom frames and reproduce a subprocess deadlock),
# which takes minutes and says nothing about this repo's own code. What they do
# say is whether docs/plan/engine-known-issues.md still describes reality — and
# until now nothing ever ran the script, which also returned 0 no matter what it
# found. Trigger it by moving the engine pin, or on demand after an upgrade.

on:
  workflow_dispatch:
  push:
    paths:
      - backend/requirements.txt
      - scripts/verify_known_issues.py
      - docs/plan/engine-known-issues.md

permissions:
  contents: read

concurrency:
  group: known-issues-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install the engine under review
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      # Non-zero exit means a verdict drifted from the documented one; the
      # script's own message names the issue and says to update the document
      # and its EXPECTED table in the same commit.
      - name: Re-verify the documented engine issues
        shell: pwsh
        run: |
          python scripts/verify_known_issues.py 2>&1 | Tee-Object -FilePath known-issues.log
          $code = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Get-Content known-issues.log -Raw)
          exit $code
